<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Confirmaciones de Saldos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: barra fija con empresa/ejercicio, pestañas, vista de trabajo y panel lateral para editar */
:root{
  --paper:#f3f5f8; --surface:#ffffff; --sunk:#eef1f5; --ink:#16202c; --muted:#5a6676; --line:#dbe1e9;
  --accent:#2a4bb0; --accent-ink:#ffffff; --ok:#1d7548; --warn:#a76300; --bad:#b0281f; --mark:#fff1b8;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r:6px; --shadow:0 10px 40px rgba(16,24,40,.18);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0e131a; --surface:#151c26; --sunk:#1b2430; --ink:#e5e9ef; --muted:#97a2b2; --line:#283343;
  --accent:#7f9cf2; --accent-ink:#0e131a; --ok:#5fc490; --warn:#e3a84d; --bad:#f07a70; --mark:#5a4a12;
  --shadow:0 10px 40px rgba(0,0,0,.5); color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0e131a; --surface:#151c26; --sunk:#1b2430; --ink:#e5e9ef; --muted:#97a2b2; --line:#283343;
  --accent:#7f9cf2; --accent-ink:#0e131a; --ok:#5fc490; --warn:#e3a84d; --bad:#f07a70; --mark:#5a4a12;
  --shadow:0 10px 40px rgba(0,0,0,.5); color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* Barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;padding-block:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:36px;height:36px;border:2px solid var(--accent);color:var(--accent);border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:18px;transform:rotate(-8deg);flex:none}
.brand b{display:block;font-size:16px;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46ch}
.pickers{display:flex;flex-wrap:wrap;gap:10px}
.pickers label{display:flex;flex-direction:column;gap:2px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.pickers select{min-width:180px;max-width:260px;text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink)}
.tabs{display:flex;gap:4px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 12px;border-bottom:2px solid transparent;color:var(--muted);font-weight:600;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* Controles */
select,input,textarea{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;min-width:0}
textarea{resize:vertical;min-height:64px}
input[readonly]{background:var(--sunk);color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 12px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 8px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

main{padding-block:20px 60px;display:flex;flex-direction:column;gap:18px}
.banner{margin-top:12px;padding:10px 14px;border:1px solid var(--warn);border-radius:var(--r);color:var(--warn);background:color-mix(in srgb,var(--warn) 8%,var(--surface))}

/* Encabezado de vista */
.vhead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.vhead h1{font-size:22px;letter-spacing:-.02em}
.vhead .sub{color:var(--muted);margin-top:2px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.actions{display:flex;flex-wrap:wrap;gap:8px}

/* Franja de indicadores */
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.strip>div{padding:14px 16px;border-left:1px solid var(--line);min-width:0}
.strip>div:first-child{border-left:0}
.strip .k{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.strip .v{font-size:22px;font-weight:700;margin-top:4px;font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.strip .d{color:var(--muted);font-size:12px;margin-top:2px}
.bar{height:6px;background:var(--sunk);border-radius:3px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
@media (max-width:820px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}.strip>div:nth-child(3){border-left:0}.strip>div:nth-child(n+3){border-top:1px solid var(--line)}}

/* Filtros */
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;cursor:pointer;font-weight:600;font-size:13px}
.chip span{color:var(--muted);font-weight:500;margin-left:4px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip[aria-pressed="true"] span{color:inherit;opacity:.7}
.filters .grow{flex:1 1 200px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#q{min-width:0;width:220px;max-width:100%}

/* Tabla */
.tbl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:820px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--sunk);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.row{cursor:pointer}
tbody tr.row:hover td{background:color-mix(in srgb,var(--accent) 5%,var(--surface))}
td.r,th.r{text-align:right}
tr.cancel td{color:var(--muted)}
tr.cancel .who b,tr.cancel td.num{text-decoration:line-through}
.who b{display:block;font-weight:600}
.who small{color:var(--muted)}
.idx{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.neg{color:var(--bad)}
.zero{color:var(--muted)}

/* Sellos de estado */
.pill{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 7px;border:1.5px solid currentColor;border-radius:3px;white-space:nowrap}
.pill[data-c="muted"]{color:var(--muted)}
.pill[data-c="accent"]{color:var(--accent)}
.pill[data-c="ok"]{color:var(--ok)}
.pill[data-c="warn"]{color:var(--warn)}
.pill[data-c="bad"]{color:var(--bad)}

/* Estado vacío */
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:40px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty h2{font-size:18px}
.empty p{color:var(--muted);max-width:56ch;margin:0}

/* Tarjetas de empresa */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h3{font-size:16px}
.card .meta{color:var(--muted);font-size:13px}
.ejs{display:flex;flex-direction:column;gap:6px}
.ej{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);cursor:pointer;background:none;text-align:left}
.ej:hover{border-color:var(--accent)}
.ej b{font-weight:600}
.ej small{color:var(--muted);grid-column:1/-1}
.ej .bar{grid-column:1/-1;margin-top:2px}

/* Panel lateral */
#drawerBack{position:fixed;inset:0;background:rgba(10,15,22,.4);z-index:20}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--surface);z-index:21;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.dh h2{font-size:18px}
.db{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:18px}
.df{display:flex;flex-wrap:wrap;gap:8px;padding:12px 20px;border-top:1px solid var(--line);background:var(--sunk)}
.df .sp{flex:1}
fieldset{border:0;padding:0;margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
legend{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-bottom:10px;padding:0}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.w{grid-column:1/-1}
.f label{font-size:12px;font-weight:600;color:var(--muted)}
.f .hint{font-size:12px;color:var(--muted)}
@media (max-width:520px){fieldset{grid-template-columns:1fr}}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{cursor:pointer;color:var(--muted)}
.seg input:checked+label .pill{background:color-mix(in srgb,currentColor 12%,transparent)}
.seg input:not(:checked)+label .pill{opacity:.55;border-style:dashed}
.seg input:focus-visible+label{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.letras{font-size:12px;color:var(--muted);font-family:var(--f-mono);line-height:1.4}
.audit{font-size:12px;color:var(--muted)}
.membrete{border:1px dashed var(--line);border-radius:var(--r);padding:10px;background:#fff;min-height:44px;display:flex;align-items:center}
.membrete img{max-width:100%;max-height:140px;display:block;margin:0 auto}

/* Vista previa tipo carta */
details.pv summary{cursor:pointer;font-weight:700;font-size:13px}
.paper{margin-top:10px;background:#fff;color:#1a1a1a;border:1px solid var(--line);padding:28px 30px;font-family:Arial,Helvetica,sans-serif;font-size:12.5px;line-height:1.6;border-radius:2px}
.paper p{margin:0 0 10px}
.paper .r{text-align:right}
.paper .c{text-align:center}
.paper mark{background:var(--mark);color:inherit;padding:0 2px}
.paper .foot{display:flex;gap:18px;font-size:10px;margin-top:18px;border-top:1px solid #ccc;padding-top:6px}

.tbl-s table{min-width:640px}
.list{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.list li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.list li:last-child{border-bottom:0}
.kv{display:grid;grid-template-columns:minmax(120px,180px) 1fr;gap:6px 16px}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.kv.kv-s{grid-template-columns:84px 1fr;font-size:13px}

/* Cédula de control */
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.sheet-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px}
.sheet-head>div b{display:block;font-size:14px;line-height:1.5}
.hbox{border-collapse:collapse;font-size:12px;min-width:0;width:auto}
.hbox th,.hbox td{border:1px solid var(--ink);padding:3px 8px;background:none;text-transform:uppercase;font-size:11px;letter-spacing:.03em;color:var(--ink)}
.hbox td{text-transform:none;min-width:150px;padding:0}
.hbox .cell{width:100%;border:0;border-radius:0;color:var(--bad);font-weight:600}
.ced table{min-width:1280px}
.ced th{white-space:normal;vertical-align:bottom;font-size:10.5px}
.ced td{padding:6px 8px}
.ced tfoot td{border-top:2px solid var(--ink);background:var(--sunk)}
.ced tfoot tr.pct td{border-top:1px solid var(--line);color:var(--muted)}
.cell{width:110px;padding:4px 6px;border:1px solid transparent;background:transparent;border-radius:4px;font-size:13px}
.cell.r{text-align:right}
.cell.short{width:70px}
tr:hover .cell,.cell:focus{border-color:var(--line);background:var(--surface)}
input[type="checkbox"].cell{width:16px;height:16px;accent-color:var(--bad)}
.tick{color:var(--bad);font-weight:700}
.sheet-foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;font-size:12px}
.legend{display:flex;flex-direction:column;gap:2px}
.marks{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.marks label{display:flex;gap:6px;align-items:center;font-weight:600}
.tabs button[disabled]{opacity:.4;cursor:not-allowed}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:820px){.two{grid-template-columns:1fr}}

/* Acceso con correo y contraseña */
#login{position:fixed;inset:0;z-index:40;background:var(--paper);display:grid;place-items:center;padding:16px;overflow-y:auto}
.login-box{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:28px 24px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.login-box .brand{margin-bottom:6px}
.login-box .err{color:var(--bad);font-size:13px;min-height:1em;margin:0}
.login-box .link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-weight:600;font-size:13px;align-self:flex-start}
.sesion{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.sesion span{max-width:24ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:var(--r);z-index:30;max-width:calc(100% - 32px);box-shadow:var(--shadow);font-weight:500}
.trio{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.trio input{min-width:0}
.ej .firmas{display:block;color:var(--muted,#667);font-size:12px}
@media (prefers-reduced-motion:no-preference){#drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
</style>

<header class="top">
  <div class="wrap top-in">
    <div class="brand">
      <div class="mark" aria-hidden="true">✓</div>
      <div><b>Confirmaciones de Saldos</b><small id="despachoName">Despacho sin configurar</small></div>
    </div>
    <div class="pickers">
      <label for="selEmpresa">Empresa<select id="selEmpresa"></select></label>
      <label for="selEjercicio">Ejercicio<select id="selEjercicio"></select></label>
    </div>
    <div class="sesion" id="sesion" hidden><span id="sesionCorreo"></span><button class="btn sm ghost" data-act="salir">Salir</button></div>
  </div>
  <nav class="wrap tabs" id="tabs" role="tablist">
    <button role="tab" data-tab="inicio">Despachos</button>
    <button role="tab" data-tab="empresas">Empresas y ejercicios</button>
    <button role="tab" data-tab="confirmaciones">Confirmaciones</button>
    <button role="tab" data-tab="resumen">Control y resumen</button>
  </nav>
</header>
<div id="banner" class="wrap" hidden><div class="banner" id="bannerText"></div></div>
<main class="wrap" id="view">
  <div class="empty"><h2>Cargando confirmaciones…</h2><p>Conectando con la base de datos compartida del despacho.</p></div>
</main>
<div id="drawerBack" hidden></div>
<aside id="drawer" hidden aria-modal="true" role="dialog"></aside>
<div id="toast" hidden role="status"></div>
<div id="login" hidden>
  <form class="login-box" id="fLogin">
    <div class="brand"><div class="mark" aria-hidden="true">✓</div><div><b>Confirmaciones de Saldos</b><small>Acceso para el equipo del despacho</small></div></div>
    <div class="f"><label for="lCorreo">Correo</label><input id="lCorreo" type="email" autocomplete="username" required></div>
    <div class="f"><label for="lClave">Contraseña</label><input id="lClave" type="password" autocomplete="current-password" required></div>
    <p class="err" id="lErr"></p>
    <button class="btn primary" type="submit" id="lEntrar">Entrar</button>
    <button class="link" type="button" id="lOlvide">Olvidé mi contraseña</button>
  </form>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<script>
/* =====================================================================
   CONFIGURACIÓN DE FIREBASE — pega aquí los datos de tu proyecto
   (Consola de Firebase → Configuración del proyecto → Tus apps → Web → firebaseConfig)
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCgW8QZMaj23DaorWfaS8XSRbkSx9VlKqo",
  authDomain: "confirmacion-de-saldos.firebaseapp.com",
  projectId: "confirmacion-de-saldos",
  appId: "1:232905441057:web:a9569ee2d9967ec592c860"
};

/* ---------- Utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = { get(k){ try { return localStorage.getItem(k) } catch(e) { return null } }, set(k,v){ try { localStorage.setItem(k,v) } catch(e) {} } };
const nf = new Intl.NumberFormat('es-MX', {minimumFractionDigits:2, maximumFractionDigits:2});
const money = n => nf.format(+n || 0);
const pad = n => String(n).padStart(2,'0');
const hoyISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}` };
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const fechaLarga = iso => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ''); return m ? `${+m[3]} de ${MESES[+m[2]-1]} de ${m[1]}` : '' };
const fechaCorta = iso => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ''); return m ? `${m[3]}/${m[2]}/${m[1]}` : '—' };
const parseMonto = s => { if (typeof s === 'number') return s; const t = String(s ?? '').replace(/[^0-9.\-]/g,''); return t === '' || t === '-' ? NaN : parseFloat(t) };
const pct = (a,b) => b ? Math.round(a / b * 100) : 0;
const oneLine = s => String(s ?? '').replace(/\s*\n\s*/g, ', ').trim();

function letras(valor, moneda){
  const U = ['','UN','DOS','TRES','CUATRO','CINCO','SEIS','SIETE','OCHO','NUEVE','DIEZ','ONCE','DOCE','TRECE','CATORCE','QUINCE','DIECISÉIS','DIECISIETE','DIECIOCHO','DIECINUEVE','VEINTE','VEINTIÚN','VEINTIDÓS','VEINTITRÉS','VEINTICUATRO','VEINTICINCO','VEINTISÉIS','VEINTISIETE','VEINTIOCHO','VEINTINUEVE'];
  const D = ['','','','TREINTA','CUARENTA','CINCUENTA','SESENTA','SETENTA','OCHENTA','NOVENTA'];
  const C = ['','CIENTO','DOSCIENTOS','TRESCIENTOS','CUATROCIENTOS','QUINIENTOS','SEISCIENTOS','SETECIENTOS','OCHOCIENTOS','NOVECIENTOS'];
  const cientos = x => { if (x === 100) return 'CIEN'; const c = Math.floor(x/100), r = x % 100; let s = C[c];
    if (r) s += (s ? ' ' : '') + (r < 30 ? U[r] : D[Math.floor(r/10)] + (r % 10 ? ' Y ' + U[r % 10] : '')); return s };
  const miles = x => { const m = Math.floor(x/1000), r = x % 1000; let s = m ? (m === 1 ? 'MIL' : cientos(m) + ' MIL') : '';
    if (r) s += (s ? ' ' : '') + cientos(r); return s };
  const n = Number(valor); if (!isFinite(n)) return '';
  const t = Math.round(Math.abs(n) * 100), ent = Math.floor(t / 100), cts = t % 100;
  const mm = Math.floor(ent / 1e6), r = ent % 1e6;
  let s = mm ? (mm === 1 ? 'UN MILLÓN' : miles(mm) + ' MILLONES') : '';
  if (r) s += (s ? ' ' : '') + miles(r);
  if (!ent) s = 'CERO';
  if (mm && !r) s += ' DE';
  const usd = moneda === 'USD';
  const unidad = ent === 1 ? (usd ? 'DÓLAR' : 'PESO') : (usd ? 'DÓLARES' : 'PESOS');
  return `${s} ${unidad} ${pad(cts)}/100 ${usd ? 'USD' : 'M.N.'}`;
}

/* ---------- Catálogos fijos ---------- */
const TIPOS_BASE = {
  cliente:   { l:'Clientes', s:'Cliente', pref:'C', sentido:'a su cargo', carta:'cliente-carta', resp:'cliente-respuesta', respL:'Hoja de respuesta', campo:'Cliente' },
  proveedor: { l:'Proveedores', s:'Proveedor', pref:'P', sentido:'a su favor', carta:'proveedor-carta', resp:'proveedor-respuesta', respL:'Hoja de respuesta', campo:'Proveedor' },
  acreedor:  { l:'Acreedores', s:'Acreedor', pref:'AC', sentido:'a su favor', carta:'acreedor-carta', resp:'acreedor-respuesta', respL:'Hoja de respuesta', campo:'Acreedor' },
  dxp:       { l:'Documentos por pagar', s:'Documento por pagar', pref:'DP', sentido:'a su favor', carta:'dxp-carta', resp:'dxp-respuesta', respL:'Hoja de respuesta', campo:'DxP_Proveedor' },

   carta de clientes (saldo a su cargo, cuenta deudora) o la de acreedores (saldo a su favor, cuenta acreedora) */
const tipoExtra = t => {
  const cargo = t.nat === 'cargo';
  return { l: t.l, s: t.s || t.l, pref: t.pref || 'X', sentido: cargo ? 'a su cargo' : 'a su favor', carta: cargo ? 'cliente-carta' : 'acreedor-carta',
    resp: cargo ? 'cliente-respuesta' : 'acreedor-respuesta', respL: 'Hoja de respuesta', campo: cargo ? 'Cliente' : 'Acreedor', extra: true, nat: cargo ? 'cargo' : 'favor' };
};

function calc(list){
  const r = { n:0, env:0, resp:0, dif:0, sin:0, total:0, conf:0, difMonto:0 };
  for (const c of list){
    if (!vigente(c)) continue;
    r.n++;
    const s = Math.abs(+c.saldo || 0); r.total += s;
    if (c.estado && c.estado !== 'borrador') r.env++;
    if (RESPONDIDAS.includes(c.estado)){ r.resp++; r.conf += s }
    if (c.estado === 'diferencia') r.dif++;
    if (c.estado === 'sin_respuesta') r.sin++;
    if (c.saldoConfirmado !== null && c.saldoConfirmado !== undefined && c.saldoConfirmado !== '') r.difMonto += Math.abs((+c.saldo||0) - (+c.saldoConfirmado||0));
  }
  return r;
}
const diferencia = c => (c.saldoConfirmado === null || c.saldoConfirmado === undefined || c.saldoConfirmado === '') ? null : (+c.saldo||0) - (+c.saldoConfirmado||0);

const ESTATUS = { conforme:'C', conciliada:'INC. ACLARADA', diferencia:'INCONFORME', sin_respuesta:'NC', enviada:'NC', borrador:'—', cancelada:'CANCELADA' };
function ctrlMontos(c){
  const conf = c.estado === 'conforme' ? num0(c.saldoConfirmado ?? c.saldo) : 0;
  const acl = (c.estado === 'conciliada' || c.estado === 'diferencia') ? num0(c.saldoAclarado) : 0;
  const arq = num0(c.arqueo), ev = num0(c.eventosPosteriores), an = num0(c.analisisCuenta);
  const total = conf + acl + arq + ev + an, s = Math.abs(num0(c.saldo));
  return { conf, acl, arq, ev, an, total, alcance: s ? total / s : 0 };
}
const pctTxt = f => (f * 100).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '%';
const ordIdx = (a,b) => String(a.indice||'').localeCompare(String(b.indice||''), 'es', {numeric:true});

  const h = { elaboro: x.elaboro || '', reviso: x.reviso || '', indice: indicePapel(x, false), ...((x.cedulas || {})[cedTipo] || {}) };
  const tot = { saldo:0, conf:0, acl:0, arq:0, ev:0, an:0, total:0 };
  const rows = list.map(c => { const m = ctrlMontos(c); tot.saldo += Math.abs(num0(c.saldo)); for (const k of ['conf','acl','arq','ev','an','total']) tot[k] += m[k]; return { c, m } });
  return { x, h, rows, tot };
}

const CAMPOS_MONTO = ['saldoAclarado','arqueo','eventosPosteriores','analisisCuenta'];
async function guardarCelda(el){
  if (!canWrite || !db) return;
  if (el.dataset.ced){
    const k = el.dataset.ced, v = el.type === 'checkbox' ? el.checked : el.value.trim();
    await write(db.doc('ejercicios/' + selX), { cedulas: { [cedTipo]: { [k]: v } } }, false);
    return;
  }
  const c = st.confs.find(x => x.id === el.dataset.id); if (!c) return;
  const k = el.dataset.k;
  let v = el.type === 'checkbox' ? el.checked : el.value.trim();
  if (CAMPOS_MONTO.includes(k)) {
    if (v === '') v = null;
    else { v = parseMonto(v); if (isNaN(v)) { toast('Escribe un importe válido, por ejemplo 15430.50'); el.focus(); return } }

}

/* ---------- PDF (jsPDF + autoTable) ---------- */
const ROJO = [192, 0, 0];
function pdfListo(){
  const J = window.jspdf && window.jspdf.jsPDF;
  if (!J || !J.API.autoTable) { toast('No se pudo cargar el generador de PDF. Recarga la página.'); return null }
  return J;
}
/* Helvetica no trae el signo √: se dibuja con dos trazos, base en (x, y) y alto h */
function palomita(doc, x, y, h, color = ROJO){
  doc.setDrawColor(...color); doc.setLineWidth(h * 0.1);
  doc.line(x, y - h * 0.4, x + h * 0.25, y); doc.line(x + h * 0.25, y, x + h * 0.6, y - h);
  doc.setDrawColor(0); doc.setLineWidth(0.5);
}
function pies(doc, izq){
  const n = doc.getNumberOfPages(), W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
  for (let i = 1; i <= n; i++){
    doc.setPage(i); doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(110);
    doc.text(izq, 30, H - 18); doc.text(`Página ${i} de ${n}`, W - 30, H - 18, { align: 'right' });
  }
  doc.setTextColor(0);
}
const sinGuion = s => String(s || '').replace('—', '');
const nombrePdf = s => s.replace(/[\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim();

let appAlta = null;
async function usuarioOk(){
  const correo = val('uCorreo').toLowerCase(), clave = $('#uClave').value, nombre = val('uNombre'), admin = $('#uAdmin').checked;
  if (!/^\S+@\S+\.\S+$/.test(correo)) { toast('Escribe un correo válido.'); return }
  if (clave.length < 6) { toast('La contraseña debe tener al menos 6 caracteres.'); return }
  const b = document.querySelector('[data-act="usuarioOk"]'); b.disabled = true; b.textContent = 'Dando de alta…';
  try {
    /* Una segunda instancia crea la cuenta sin cerrar la sesión del administrador */
    if (!appAlta) appAlta = firebase.initializeApp(FIREBASE_CONFIG, 'alta');
    try { await appAlta.auth().createUserWithEmailAndPassword(correo, clave); await appAlta.auth().signOut() }
    catch(e){ if (e.code !== 'auth/email-already-in-use') throw e }
    await db.doc('usuarios/' + correo).set({ nombre, admin, altaPor: me, altaEn: new Date().toISOString() });
    toast(`${correo} ya puede entrar.`); closeDrawer();
  } catch(e){
    b.disabled = false; b.textContent = 'Dar de alta';
    toast(e.code === 'auth/weak-password' ? 'La contraseña es muy débil.' : e.code === 'auth/invalid-email' ? 'El correo no es válido.' : e.code === 'permission-denied' ? 'Solo un administrador puede dar de alta usuarios.' : 'No se pudo dar de alta. ' + (e.message || ''));
  }
}

/* ---------- Respaldo ---------- */
async function respaldo(){
  const out = { formato:'confirmaciones-respaldo-1', exportado: hoyISO(), despachos:{}, empresas:{}, ejercicios:{}, confirmaciones:{}, membretes:{} };
  try {
    for (const col of Object.keys(out).filter(k => typeof out[k] === 'object')) {
      const s = await db.collection(col).get(); s.docs.forEach(d => out[col][d.id] = d.data());
    }
    await guardarArchivo(`Respaldo confirmaciones ${hoyISO()}.json`, JSON.stringify(out, null, 1));
  } catch(e){ dbError(e) }
}
async function importarRespaldo(file){
  let r; try { r = JSON.parse(await file.text()) } catch(e){ toast('El archivo no es un respaldo válido.'); return }
  const cols = ['despachos','empresas','ejercicios','confirmaciones','membretes'].filter(c => r[c] && typeof r[c] === 'object');
  const total = cols.reduce((n, c) => n + Object.keys(r[c]).length, 0);
  if (!total) { toast('El respaldo no trae información.'); return }
  if (!confirm(`Se importarán ${total} registros. Los que tengan el mismo identificador se reemplazarán. ¿Continuar?`)) return;
  const membretes = r.membretes || {};
  let batch = db.batch(), n = 0, hechos = 0;
  try {
    for (const c of cols) for (const [id, d] of Object.entries(r[c])) {
      const doc = { ...d };
      /* Un membrete que no viene en el respaldo (por ejemplo, de claude.ai) se quita: hay que volver a subirlo */
      if (c === 'empresas' && doc.membrete && !membretes[doc.membrete]) { doc.membrete = ''; doc.membreteW = 0; doc.membreteH = 0 }
      batch.set(db.doc(c + '/' + id), doc); n++;
      if (n === 400) { await batch.commit(); hechos += n; batch = db.batch(); n = 0; toast(`Importando… ${hechos} de ${total}`) }
    }
    if (n) { await batch.commit(); hechos += n }
    toast(`Respaldo importado: ${hechos} registros.`);
  } catch(e){ dbError(e) }
}

}

function formConf(){
  const id = $('#fConf')?.dataset.id || '';
  const base = id ? st.confs.find(x => x.id === id) || {} : {};
  const conf = val('cConf');
  return { ...base, id, empresaId: base.empresaId || selE, ejercicioId: base.ejercicioId || selX,
    tipo: val('cTipo'), indice: val('cIndice'), nombre: val('cNombre'), direccion: val('cDireccion'), email: val('cEmail'), contacto: val('cContacto'),
    saldo: parseMonto(val('cSaldo')), moneda: val('cMoneda'), fechaEmision: val('cFecha'),
    estado: (document.querySelector('input[name="cEstado"]:checked') || {}).value || 'borrador',
    fechaEnvio: val('cEnvio'), fechaRespuesta: val('cResp'), saldoConfirmado: conf === '' ? null : parseMonto(conf), observaciones: val('cObs'),
    cuentaContable: val('cCuenta') };
}

async function guardarConf(silencioso){
  const f = formConf();
  if (!f.nombre) { toast('Escribe el nombre del tercero.'); $('#cNombre').focus(); return null }
  if (isNaN(f.saldo)) { toast('El saldo no es un importe válido. Usa números, por ejemplo 125430.50'); $('#cSaldo').focus(); return null }
  if (f.saldoConfirmado !== null && isNaN(f.saldoConfirmado)) { toast('El saldo confirmado no es un importe válido.'); $('#cConf').focus(); return null }
  if (f.estado === 'conforme' && f.saldoConfirmado === null) f.saldoConfirmado = f.saldo;
  if (f.estado === 'enviada' && !f.fechaEnvio) f.fechaEnvio = hoyISO();
  const { id, ...data } = f;
  const isNew = !id;
  const ref = isNew ? db.collection('confirmaciones').doc() : db.doc('confirmaciones/' + id);
  for (const k of ['actualizadoPor','actualizadoEn','creadoPor','creadoEn']) delete data[k];
  const ok = await write(ref, data, isNew);
  if (!ok) return null;
  if (isNew) $('#fConf').dataset.id = ref.id;
  if (!silencioso) { toast(isNew ? 'Confirmación agregada' : 'Cambios guardados'); closeDrawer() }
  return { ...f, id: ref.id };
}

/* Carga masiva: un archivo de Excel (o renglones pegados) se convierte en una confirmación por renglón */
let importAoa = null, importArchivo = '';
const COLS = [
  ['tipo', /^tipo/i], ['cuenta', /cuenta/i], ['direccion', /direcci|domicilio/i], ['saldo', /saldo|importe|monto/i], ['email', /correo|e-?mail/i],
  ['contacto', /contacto|atenci/i], ['moneda', /moneda|divisa/i], ['indice', /[ií]ndice/i],
  ['nombre', /nombre|raz[oó]n|proveedor|cliente|acreedor|tercero|banco|beneficiario|destinatario/i]];
const sinAcentos = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim();
function tipoDe(s){ s = String(s || '').toLowerCase(); if (!s) return '';
  /* primero los tipos agregados por el usuario (por su nombre en plural o singular) */
  const n = sinAcentos(s); for (const [k, t] of Object.entries(TIPOS)) if (t.extra && (sinAcentos(t.l) === n || sinAcentos(t.s) === n)) return k; if (/cliente/.test(s)) return 'cliente'; if (/acreed/.test(s)) return 'acreedor'; if (/doc|dxp|pagar/.test(s)) return 'dxp'; if (/banc/.test(s)) return 'banco'; if (/prove/.test(s)) return 'proveedor'; return '' }
function filasAConfs(aoa){
  const rows = (aoa || []).map((r, i) => ({ r, n: i + 1 })).filter(({r}) => r && r.some(c => String(c ?? '').trim() !== ''));
  const ok = [], bad = [];
  if (!rows.length) return { ok, bad };
  const h = rows[0].r.map(c => String(c ?? '').trim());
  let map, start = 0;
  if (h.some(c => /nombre|saldo|importe|monto|direcci|proveedor|raz[oó]n/i.test(c))) {
    map = {}; start = 1;
    h.forEach((c, i) => { for (const [k, re] of COLS) if (!(k in map) && re.test(c)) { map[k] = i; break } });
  } else map = { nombre:0, direccion:1, saldo:2, email:3 };
  for (const { r, n } of rows.slice(start)){
    const g = k => map[k] === undefined ? '' : String(r[map[k]] ?? '').trim();
    const raw = map.saldo === undefined ? '' : r[map.saldo];
    const saldo = typeof raw === 'number' ? raw : parseMonto(raw);
    const nombre = g('nombre');
    if (!nombre || isNaN(saldo)) { bad.push(n); continue }
    const mon = g('moneda');
    ok.push({ nombre, direccion: g('direccion'), saldo, email: g('email'), contacto: g('contacto'), tipo: tipoDe(g('tipo')), moneda: mon ? (/usd|d[oó]lar/i.test(mon) ? 'USD' : 'MXN') : '', indice: g('indice'), cuenta: g('cuenta') });
  }
  return { ok, bad };
}
function leerImport(){
  const txt = $('#iTexto')?.value || '';
  if (txt.trim()) return filasAConfs(txt.split(/\r?\n/).map(l => l.split('\t')));
  return filasAConfs(importAoa);
}

/* ---------- Escritura en la base ---------- */
async function write(ref, data, isNew){
  if (!db) { toast('No hay conexión con la base de datos. Recarga la página.'); return false }
  const now = new Date().toISOString();
  const meta = { actualizadoPor: me, actualizadoEn: now };
  try {
    /* merge: los mapas anidados (como cedulas.{tipo}) se combinan en vez de reemplazarse */
    if (isNew) await ref.set({ ...data, ...meta, creadoPor: me, creadoEn: now });
    else await ref.set({ ...data, ...meta }, { merge: true });
    return true;
  } catch(e){ dbError(e); return false }
}
async function borrar(path, msg){ try { await db.doc(path).delete(); toast(msg); closeDrawer() } catch(e){ dbError(e) } }
function dbError(e){
  const code = e && e.code;
  if (code === 'permission-denied') toast('No se pudo guardar: tu usuario no tiene permiso. Pide al administrador que te dé de alta.');
  else if (code === 'resource-exhausted') toast('Se alcanzó el límite diario de la base de datos. Intenta más tarde.');
  else if (code === 'unavailable') toast('Sin conexión. Revisa tu internet e intenta de nuevo.');
  else toast('No se pudo guardar. Revisa tu conexión e intenta de nuevo.');
}

const NS_W = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';
const NS_S = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';
/* El bloque #plantillas (al final del archivo) guarda tus archivos originales: cada parte del ZIP una sola vez */
let paquete = null;
async function plantilla(key){
  if (!paquete) paquete = JSON.parse(document.getElementById('plantillas').textContent);
  const { pool, plantillas } = paquete;
  const zip = new JSZip();
  for (const [name, h] of plantillas[key]) zip.file(name, pool[h], { base64: true });

}

/* Correcciones de redacción aprobadas (oct-2026). Se aplican al texto de cada párrafo de la plantilla
   antes de llenar los campos, así pueden incluir <Campo>. Los espacios se buscan con \s+ porque
   las plantillas traen espacios dobles irregulares. */
const CORRECCIONES = [
  // 1. Lugar y fecha
  [/^\s*Mérida, Yucatán\s+a\s+<Fecha_Emision>\.?\s*$/, 'Mérida, Yucatán, a <Fecha_Emision>.'],

    'Nuestros auditores del despacho externo <EmpAuditora_Nombre>, con domicilio en <EmpAuditora_Direccion>, <EmpAuditora_InfContacto>, están realizando la auditoría de nuestros estados financieros al <Fecha_FinEjercicio>. Por tal motivo, le(s) solicitamos atentamente examinar el saldo a su $1 que, al <Fecha_FinEjercicio>, muestran nuestros registros: \u0001$ <$2_Saldo>\u0002 (Son: <$2_SaldoLetras>).'],
  [/Nuestros auditores\s+(?!del despacho)/, 'Nuestros auditores del despacho externo '],
  // 5-6. Envío de la respuesta y diferencias

    'Sírvase(n) enviar su respuesta en la hoja anexa directamente a nuestros auditores, al correo electrónico <EmpAuditora_eMail>. En caso de que el saldo no coincida con sus registros, le(s) agradeceremos indicarnos la diferencia y el importe que muestran sus registros contables.'],

  [/^\s*Con motivo de la auditoría,\s*a nuestros estados financieros que están realizando nuestros\s+auditores del\s+<EmpAuditora_Nombre>,\s*con fecha\s+<Fecha_FinEjercicio>;[\s\S]*<EmpAuditora_eMail>\.\s*$/,

  [/nuestros\s+auditores del\s+(?!despacho)/, 'nuestros auditores del despacho externo '],

  [/“ninguno\s*“/, '“ninguno”'],
  [/a las\s+cuentas y operaciones señaladas con \(\s*X\s*\) en los párrafos 1, 2, 3, 4 y 5;\s*a las fechas/, 'a las cuentas y operaciones señaladas con (X) en los párrafos 1 a 5, a las fechas'],
  [/quedamos de ustedes\.\s*$/, 'quedamos a sus órdenes.'],
  [/^(<Empresa_Nombre>)\.\s*$/, '$1'],
  // 14-17. Hojas de respuesta
  [/^El saldo de \$\s*<(\w+)_Saldo>\s*\(Son:\s*<\w+_SaldoLetras>\)\s*que al\s+<Fecha_FinEjercicio>\s*,\s*se refleja a nuestro (cargo|favor)\s*\(\s*<\w+_Nombre>\s*\);\s*en los registros\s+contables\s+de\s+<Empresa_Nombre>\s+es:\s*$/,
    'El saldo a nuestro $2 de \u0001$ <$1_Saldo>\u0002 (Son: <$1_SaldoLetras>) que, al <Fecha_FinEjercicio>, muestran los registros contables de <Empresa_Nombre>, es:'],
  [/^Señalar\s+con\s+una\s+X\s+si es:\s*$/, 'Marque con una X:'],
  [/^Nota:\s*Favor de adjuntar estado de cuenta\.\s*$/, 'Nota: favor de adjuntar su estado de cuenta.'],
  [/,\s*Tels\.\s*9821900, 9823703 y correo electrónico\s+AUDITORIAGONZALEZ@HOTMAIL\.COM\.?\s*$/, ', <EmpAuditora_InfContacto>.'],
];
/* En CORRECCIONES, \u0001…\u0002 marca texto en negritas (el importe). Al reescribir un párrafo todo queda
   en el primer run, así que aquí se parte ese run en varios y se agrega <w:b/> a los que van en negritas. */
const NEG = /[\u0001\u0002]/;
function negritas(ts, ns){
  let on = false;
  for (const t of ts){
    const txt = t.textContent; if (!NEG.test(txt)) continue;
    const r = t.parentNode, doc = t.ownerDocument, partes = []; let buf = '';
    for (const ch of txt){ if (ch === '\u0001' || ch === '\u0002'){ if (buf) partes.push([buf, on]); buf = ''; on = ch === '\u0001' } else buf += ch }
    if (buf) partes.push([buf, on]);
    const rPr = Array.from(r.childNodes).find(n => n.localName === 'rPr');
    for (const [s, b] of partes){
      const nr = r.cloneNode(false);
      if (rPr || b){
        const pr = rPr ? rPr.cloneNode(true) : doc.createElementNS(ns, 'w:rPr');
        Array.from(pr.childNodes).filter(n => n.localName === 'b' || n.localName === 'bCs').forEach(n => pr.removeChild(n));
        if (b){
          const ref = Array.from(pr.childNodes).find(n => n.localName !== 'rStyle' && n.localName !== 'rFonts') || null;
          pr.insertBefore(doc.createElementNS(ns, 'w:b'), ref); pr.insertBefore(doc.createElementNS(ns, 'w:bCs'), ref);
        }
        nr.appendChild(pr);
      }
      const nt = doc.createElementNS(ns, 'w:t'); nt.setAttributeNS('http://www.w3.org/XML/1998/namespace', 'xml:space', 'preserve'); nt.textContent = s;
      nr.appendChild(nt); r.parentNode.insertBefore(nr, r);
    }
    r.parentNode.removeChild(r);
  }
}

/* Sustituye texto aunque Word lo haya partido en varios fragmentos (runs) del mismo párrafo */
function llenarXml(xml, ns, parTag, tTag, v, lit){
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  for (const p of Array.from(doc.getElementsByTagNameNS(ns, parTag))){
    const ts = Array.from(p.getElementsByTagNameNS(ns, tTag)).filter(t => { let n = t.parentNode; while (n && !(n.localName === parTag && n.namespaceURI === ns)) n = n.parentNode; return n === p });
    if (!ts.length) continue;
    const pasada = hitsDe => {
      const hits = hitsDe(ts.map(t => t.textContent).join(''));
      hits.sort((a,b) => b[0] - a[0]);
      for (const [s, e, rep] of hits){
        let pos = 0; const off = ts.map(t => { const o = pos; pos += t.textContent.length; return o });
        const i = ts.findIndex((t,n) => s >= off[n] && s < off[n] + t.textContent.length);
        const j = ts.findIndex((t,n) => e > off[n] && e <= off[n] + t.textContent.length);
        if (i < 0 || j < 0) continue;
        const ti = ts[i].textContent, tj = ts[j].textContent;
        if (i === j) ts[i].textContent = ti.slice(0, s - off[i]) + rep + ti.slice(e - off[i]);
        else { ts[i].textContent = ti.slice(0, s - off[i]) + rep; for (let k = i + 1; k < j; k++) ts[k].textContent = ''; ts[j].textContent = tj.slice(e - off[j]) }
        for (let k = i; k <= j; k++) ts[k].setAttributeNS('http://www.w3.org/XML/1998/namespace', 'xml:space', 'preserve');
      }
    };
    for (const [re, rep] of CORRECCIONES) pasada(full => {
      const m = re.exec(full); return m && m[0] ? [[m.index, m.index + m[0].length, m[0].replace(re, rep)]] : [];
    });
    for (const [k, rep] of Object.entries(lit)) pasada(full => { const h = []; let i = full.indexOf(k); while (i >= 0) { h.push([i, i + k.length, rep]); i = full.indexOf(k, i + k.length) } return h });
    pasada(full => { const h = []; full.replace(/<([A-Za-z_]+)>/g, (m, k, i) => { if (v[k] !== undefined && v[k] !== null && v[k] !== '') h.push([i, i + m.length, String(v[k])]); return m }); return h });
    if (ts.some(t => NEG.test(t.textContent))) {
      if (ns === NS_W) negritas(ts, ns); else ts.forEach(t => t.textContent = t.textContent.replace(/[\u0001\u0002]/g, ''));
    }
  }
  let out = new XMLSerializer().serializeToString(doc);
  if (!out.startsWith('<?xml')) out = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' + out;
  return out;
}

async function generar(c, cual){
  const T = tipoDeConf(c), path = cual === 'carta' ? T.carta : T.resp;
  const zip = await plantilla(path);
  const v = vars(c), lit = literales(despachoDe(c), st.ejercicios[c.ejercicioId]);
  const excel = path === 'banco-formato';
  for (const name of Object.keys(zip.files)){
    if (excel ? name === 'xl/sharedStrings.xml' : /^word\/(document|header\d*|footer\d*)\.xml$/.test(name)){
      const xml = await zip.file(name).async('string');
      zip.file(name, excel ? llenarXml(xml, NS_S, 'si', 't', v, lit) : llenarXml(xml, NS_W, 'p', 't', v, lit));
    }
  }
  if (cual === 'carta' && !excel) await ponerMembrete(zip, st.empresas[c.empresaId] || {});
  if (excel){
    const ct = await zip.file('[Content_Types].xml').async('string');
    zip.file('[Content_Types].xml', ct.replace('spreadsheetml.template.main+xml', 'spreadsheetml.sheet.main+xml'));
  }
  const blob = await zip.generateAsync({ type:'blob', compression:'DEFLATE' });
  const ext = excel ? 'xlsx' : 'docx';
  const nombre = `${c.indice ? c.indice + ' ' : ''}${T.s} ${c.nombre}`.replace(/[\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 120);
  return { blob, filename: `${nombre} - ${cual === 'carta' ? 'Carta' : (excel ? 'Formulario' : 'Respuesta')}.${ext}` };
}

/* Membrete por empresa: la imagen guardada se inserta en el encabezado (header1.xml) de la carta,
   al ancho del texto (12240 - 2 × 1701 twips ≈ 6.14 pulgadas) y con alto máximo de 1.4 pulgadas */
/* Los membretes se guardan como imagen (data URL) en la colección «membretes»; cada documento debe pesar menos de 1 MB */
const membreteCache = {};
function membreteDato(id){
  if (!membreteCache[id]) membreteCache[id] = db.doc('membretes/' + id).get().then(d => { if (!d.exists) throw new Error('membrete'); return d.data().data }).catch(err => { delete membreteCache[id]; throw err });
  return membreteCache[id];
}
function comprimirMembrete(img, tipo){
  for (const maxW of [2000, 1600, 1200, 900]) {
    const k = Math.min(1, maxW / img.naturalWidth), w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; if (tipo !== 'image/png') cx.fillRect(0, 0, w, h); cx.drawImage(img, 0, 0, w, h);
    for (const url of tipo === 'image/png' ? [cv.toDataURL('image/png')] : [0.9, 0.8, 0.7].map(q => cv.toDataURL('image/jpeg', q)))
      if (url.length < 900000) return { url, w, h };
  }
  return null;
}
async function ponerMembrete(zip, e){
  const hdr = 'word/header1.xml';
  if (!e.membrete || !zip.file(hdr)) return;
  let bytes;
  try { const url = await membreteDato(e.membrete); bytes = Uint8Array.from(atob(url.split(',')[1]), ch => ch.charCodeAt(0)).buffer }
  catch(err){ toast('No se pudo leer el membrete de la empresa; la carta sale sin él.'); return }
  const png = new Uint8Array(bytes.slice(0, 4))[0] === 0x89, ext = png ? 'png' : 'jpeg';
  const EMU = 914400, maxW = Math.round(8838 / 1440 * EMU), maxH = Math.round(1.4 * EMU);
  const ar = e.membreteW && e.membreteH ? e.membreteH / e.membreteW : 0.2;
  let cx = maxW, cy = Math.round(maxW * ar); if (cy > maxH) { cy = maxH; cx = Math.round(maxH / ar) }
  zip.file(`word/media/membrete.${ext}`, bytes);
  const relsPath = 'word/_rels/header1.xml.rels';
  let rels = zip.file(relsPath) ? await zip.file(relsPath).async('string') : '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"></Relationships>';
  rels = rels.replace('</Relationships>', `<Relationship Id="rIdMembrete" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/membrete.${ext}"/></Relationships>`);
  zip.file(relsPath, rels);
  let ct = await zip.file('[Content_Types].xml').async('string');
  if (!new RegExp(`Extension="${ext}"`, 'i').test(ct)) ct = ct.replace('<Default ', `<Default Extension="${ext}" ContentType="image/${ext}"/><Default `);
  zip.file('[Content_Types].xml', ct);
  const dib = `<w:p><w:pPr><w:jc w:val="center"/></w:pPr><w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${cx}" cy="${cy}"/><wp:docPr id="900" name="Membrete"/>`
    + `<a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture">`
    + `<pic:nvPicPr><pic:cNvPr id="0" name="membrete.${ext}"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="rIdMembrete"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill>`
    + `<pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p>`;
  const xml = await zip.file(hdr).async('string');
  zip.file(hdr, xml.replace(/<w:p[ >][\s\S]*?<\/w:p>/, dib));
}

async function guardarArchivo(filename, data){
  try {
    const blob = data instanceof Blob ? data : new Blob([data], { type: /\.json$/i.test(filename) ? 'application/json' : 'text/csv;charset=utf-8' });
    const a = document.createElement('a'), url = URL.createObjectURL(blob);
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    toast('Archivo descargado');
  } catch(e){ toast('No se pudo descargar el archivo.') }
}

async function descargar(c, cual){
  const f = faltantes(c);
  try {
    const { blob, filename } = await generar(c, cual);
    if (f.length) toast(`Faltan datos: ${f.join(', ')}. Quedaron marcados como <Campo> en el archivo.`);
    await guardarArchivo(filename, blob);
  } catch(e){ toast('No se pudo leer la plantilla. Recarga la página e intenta de nuevo.') }
}

  await loteDe(filtro.estado === 'cancelada' ? visibles() : visibles().filter(vigente), `Confirmaciones ${e.nombre} ${ejLabel(x)}.zip`);

async function loteDe(list, nombreZip){
  if (!list.length) { toast('No hay confirmaciones en la lista.'); return }
  toast(`Preparando ${list.length} confirmaciones…`);
  try {
    const out = new JSZip();
    for (const c of list){
      const dir = `${tipoDeConf(c).l.replace(/[\\/:*?"<>|]+/g, ' ')}/`;
      for (const cual of ['carta','resp']) { const g = await generar(c, cual); out.file(dir + g.filename, g.blob) }
    }
    const blob = await out.generateAsync({ type:'blob' });
    await guardarArchivo(nombreZip.replace(/[\\/:*?"<>|]+/g, ' '), blob);
  } catch(e){ toast('No se pudo armar el paquete. Intenta de nuevo.') }
}

function csv(list, nombre){
  const cols = ['Empresa','Ejercicio','Fecha de cierre','Índice','Tipo','Cuenta contable','Tercero','Dirección','Correo','Moneda','Saldo en registros','Estado','Fecha de envío','Fecha de respuesta','Saldo confirmado','Diferencia','Observaciones'];
  const q = s => `"${String(s ?? '').replace(/"/g,'""')}"`;
  const rows = list.map(c => { const e = st.empresas[c.empresaId] || {}, x = st.ejercicios[c.ejercicioId] || {}, df = diferencia(c);
    return [e.nombre, ejLabel(x), x.fechaCierre, c.indice, TIPOS[c.tipo]?.s, c.cuentaContable, c.nombre, oneLine(c.direccion), c.email, c.moneda, (+c.saldo||0).toFixed(2), ESTADOS[c.estado||'borrador'].l, c.fechaEnvio, c.fechaRespuesta, c.saldoConfirmado == null ? '' : (+c.saldoConfirmado).toFixed(2), df == null ? '' : df.toFixed(2), c.observaciones].map(q).join(',') });
  guardarArchivo(nombre.replace(/[\\/:*?"<>|]+/g, ' '), '﻿' + [cols.map(q).join(','), ...rows].join('\r\n'));
}

function preview(c){

    <p>Nuestros auditores del despacho externo ${m('EmpAuditora_Nombre')}, con domicilio en ${m('EmpAuditora_Direccion')}, ${m('EmpAuditora_InfContacto')}, están realizando la auditoría de nuestros estados financieros al ${m('Fecha_FinEjercicio')}. Por tal motivo, le(s) solicitamos atentamente examinar el saldo ${T.sentido} que, al ${m('Fecha_FinEjercicio')}, muestran nuestros registros: <b>$ ${m(p + '_Saldo')}</b> (Son: ${m(p + '_SaldoLetras')}).</p>
    <p>Sírvase(n) enviar su respuesta en la hoja anexa directamente a nuestros auditores, al correo electrónico ${m('EmpAuditora_eMail')}. En caso de que el saldo no coincida con sus registros, le(s) agradeceremos indicarnos la diferencia y el importe que muestran sus registros contables.</p>
    <p>Agradeciendo la atención que se sirva(n) dar a la presente, quedamos de usted(es), sus atentos y seguros servidores.</p>${firma}</div>`;

let tToast;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(tToast); tToast = setTimeout(() => t.hidden = true, 4200) }

document.addEventListener('click', async ev => {
  const b = ev.target.closest('[data-act]'); if (!b) { if (ev.target.id === 'drawerBack') closeDrawer(); return }
  const a = b.dataset.act, id = b.dataset.id;
  if (b.tagName === 'SELECT') return;
  if (a !== 'editar' && a !== 'ir') ev.stopPropagation();
  const getC = () => st.confs.find(x => x.id === id);
  switch (a){
    case 'ftipo': filtro.tipo = b.dataset.v; render(); break;
    case 'nueva': drawerConf(); break;
    case 'editar': if (!ev.target.closest('button')) drawerConf(id); break;
    case 'dcarta': await descargar(getC(), 'carta'); break;
    case 'dresp': await descargar(getC(), 'resp'); break;
    case 'dcartaForm': case 'drespForm': {
      let c = formConf();
      if (canWrite) { c = await guardarConf(true); if (!c) return }
      await descargar(c, a === 'dcartaForm' ? 'carta' : 'resp'); break }
    case 'guardarConf': await guardarConf(); break;
    case 'borrarConf': if (b.dataset.confirm) await borrar('confirmaciones/' + id, 'Confirmación eliminada'); else { b.dataset.confirm = 1; b.textContent = '¿Eliminar definitivamente? Clic para confirmar' } break;
    case 'empresa': drawerEmpresa(id); break;
    case 'guardarEmpresa': await guardarEmpresa(); break;
    case 'quitarMembrete': membreteForm = { id:'', w:0, h:0 }; b.hidden = true; $('#mPrev').innerHTML = '<span class="hint">Sin membrete. Pulsa Guardar para aplicarlo.</span>'; break;
    case 'borrarEmpresa': if (b.dataset.confirm) await borrar('empresas/' + id, 'Empresa eliminada'); else { b.dataset.confirm = 1; b.textContent = '¿Eliminar? Clic para confirmar' } break;
    case 'ejercicio': drawerEjercicio(b.dataset.empresa); break;
    case 'guardarEjercicio': await guardarEjercicio(); break;
    case 'borrarEjercicio': if (b.dataset.confirm) await borrar('ejercicios/' + id, 'Ejercicio eliminado'); else { b.dataset.confirm = 1; b.textContent = '¿Eliminar? Clic para confirmar' } break;
    case 'despacho': drawerDespacho(id); break;
    case 'guardarDespacho': await guardarDespacho(); break;
    case 'tipos': drawerTipos(); break;
    case 'tipoEditar': drawerTipos(b.dataset.v); break;
    case 'tipoGuardar': await guardarTipo(); break;
    case 'tipoBorrar': await borrarTipo(b.dataset.v, b); break;
    case 'importar': drawerImportar(); break;
    case 'importarOk': await importarOk(); break;
    case 'cedTipo': cedTipo = b.dataset.v; LS.set('cedTipo', cedTipo); render(); break;
    case 'cedulaXlsx': await cedulaXlsx(); break;
    case 'cedulaPdf': await cedulaPdf(); break;
    case 'pdfConfs': await confsPdf(); break;
    case 'formatoExcel': await formatoExcel(); break;
    case 'fechaLista': drawerFechaLista(); break;
    case 'fechaListaOk': await fechaListaOk(); break;
    case 'copiarPrev': b.disabled = true; await copiarPrev(b.dataset.v); break;
    case 'lote': await lote(); break;
    case 'csv': csv(visibles(), `Control ${st.empresas[selE].nombre} ${ejLabel(st.ejercicios[selX])}.csv`); break;
    case 'csvTodo': csv(confsDeDespacho(selD), `Control de confirmaciones ${st.despachos[selD]?.nombre || ''}.csv`); break;
    case 'entrar': selD = id; selE = ''; selX = ''; LS.set('selD', selD); setTab('empresas'); break;
    case 'borrarDespacho': if (b.dataset.confirm) await borrar('despachos/' + id, 'Despacho eliminado'); else { b.dataset.confirm = 1; b.textContent = '¿Eliminar? Clic para confirmar' } break;
    case 'ir': selE = b.dataset.empresa; selX = id; LS.set('selE', selE); LS.set('selX', selX); setTab('confirmaciones'); break;
    case 'cerrar': closeDrawer(); break;

    case 'usuario': drawerUsuario(); break;

    case 'quitarUsuario': if (b.dataset.confirm) { try { await db.doc('usuarios/' + id).delete(); toast('Acceso retirado') } catch(e){ dbError(e) } } else { b.dataset.confirm = 1; b.textContent = '¿Quitar? Clic para confirmar' } break;

document.addEventListener('change', ev => {

  if (t.id === 'iRespaldo') { if (t.files[0]) importarRespaldo(t.files[0]); t.value = ''; return }

/* ---------- Conexión ---------- */
function banner(msg){ $('#bannerText').textContent = msg; $('#banner').hidden = !msg }
const ERR_LOGIN = { 'auth/invalid-credential':'Correo o contraseña incorrectos.', 'auth/wrong-password':'Correo o contraseña incorrectos.', 'auth/user-not-found':'Correo o contraseña incorrectos.',
  'auth/invalid-email':'El correo no es válido.', 'auth/too-many-requests':'Demasiados intentos. Espera unos minutos.', 'auth/network-request-failed':'Sin conexión a internet.', 'auth/user-disabled':'Este usuario está deshabilitado.',
  'auth/api-key-not-valid.-please-pass-a-valid-api-key.':'Los datos de FIREBASE_CONFIG no son correctos. Revisa que los copiaste completos.' };
function pantallaLogin(msg){ $('#login').hidden = false; $('#sesion').hidden = true; $('#lErr').textContent = msg || ''; $('#lEntrar').disabled = false; $('#lEntrar').textContent = 'Entrar' }
let escuchas = [];
function conectar(){
  const onErr = e => { if (e && e.code === 'permission-denied') { banner(''); pantallaLogin('Tu usuario no tiene acceso. Pide al administrador que te dé de alta.'); escuchas.forEach(u => u()); escuchas = [] } else banner('Se perdió la conexión con la base de datos. Recarga la página.') };
  const toMap = snap => { const m = {}; snap.docs.forEach(d => m[d.id] = d.data()); return m };
  const on = (col, fn) => escuchas.push(db.collection(col).onSnapshot(s => { fn(s); if (!drawerOpen) render() }, onErr));
  on('despachos', s => { st.despachos = toMap(s); st.loaded.d = true });
  on('empresas', s => { st.empresas = toMap(s); st.loaded.e = true });
  on('ejercicios', s => { st.ejercicios = toMap(s); st.loaded.x = true });
  on('confirmaciones', s => { st.confs = s.docs.map(d => ({ id: d.id, ...d.data() })); st.loaded.c = true });
  on('usuarios', s => { st.usuarios = toMap(s); esAdmin = !!st.usuarios[me]?.admin });
}
(() => {
  if (typeof firebase === 'undefined') { banner('No se pudo cargar Firebase. Revisa tu conexión a internet y recarga la página.'); $('#view').innerHTML = empty('Sin conexión', 'No se pudo cargar el servicio de la base de datos.'); return }
  if (/PEGA_AQUI/.test(FIREBASE_CONFIG.apiKey)) { $('#view').innerHTML = empty('Falta configurar Firebase', 'Abre este archivo con el Bloc de notas y pega los datos de tu proyecto de Firebase en el bloque FIREBASE_CONFIG, al inicio del código.'); return }
  firebase.initializeApp(FIREBASE_CONFIG);
  auth = firebase.auth(); db = firebase.firestore();
  db.settings({ ignoreUndefinedProperties: true });
  $('#fLogin').addEventListener('submit', async ev => {
    ev.preventDefault();
    $('#lEntrar').disabled = true; $('#lEntrar').textContent = 'Entrando…'; $('#lErr').textContent = '';
    try { await auth.signInWithEmailAndPassword(val('lCorreo'), $('#lClave').value) }
    catch(e){ pantallaLogin(ERR_LOGIN[e.code] || 'No se pudo entrar. ' + (e.message || '')) }
  });
  $('#lOlvide').addEventListener('click', async () => {
    const correo = val('lCorreo'); if (!correo) { $('#lErr').textContent = 'Escribe tu correo y vuelve a pulsar «Olvidé mi contraseña».'; return }
    try { await auth.sendPasswordResetEmail(correo); $('#lErr').textContent = 'Te enviamos un correo para cambiar tu contraseña (revisa también no deseados).' }
    catch(e){ $('#lErr').textContent = ERR_LOGIN[e.code] || 'No se pudo enviar el correo.' }
  });
  auth.onAuthStateChanged(async u => {
    escuchas.forEach(f => f()); escuchas = [];
    Object.assign(st, { despachos:{}, empresas:{}, ejercicios:{}, confs:[], usuarios:{}, loaded:{d:false,e:false,x:false,c:false} });
    if (!u) { me = null; esAdmin = false; online = false; pantallaLogin(); return }
    me = (u.email || '').toLowerCase();
    try {
      /* El primer administrador (el correo escrito en las reglas de Firestore) se da de alta solo al entrar por primera vez */
      const r = db.doc('usuarios/' + me), d = await r.get().catch(() => null);
      if (!d || !d.exists) await r.set({ nombre: u.displayName || '', admin: true, altaPor: me, altaEn: new Date().toISOString() }).catch(() => {});
    } catch(e){}
    online = true;
    $('#login').hidden = true; $('#sesion').hidden = false; $('#sesionCorreo').textContent = me; banner('');
    $('#view').innerHTML = empty('Cargando confirmaciones…', 'Conectando con la base de datos compartida del despacho.');
    conectar();
  });
})();
