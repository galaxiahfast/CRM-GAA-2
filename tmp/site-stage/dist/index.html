<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reporte de respaldos de servidores</title>
<meta name="description" content="Analiza reportes de respaldos y muestra únicamente las empresas con error.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2317355d'/%3E%3Cpath d='M17 16h30v13H17zm0 19h30v13H17z' fill='white'/%3E%3Ccircle cx='41' cy='22.5' r='2.5' fill='%2349c58b'/%3E%3Ccircle cx='41' cy='41.5' r='2.5' fill='%2349c58b'/%3E%3C/svg%3E">
<style>
:root{--ink:#152231;--navy:#17355d;--blue:#eaf2f8;--line:#d8e0e8;--green:#18794e;--red:#b42318;--bg:#eef3f7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Inter,Segoe UI,Arial,sans-serif}.shell{max-width:1240px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:20px}h1{margin:0;font-size:clamp(1.7rem,3vw,2.5rem);letter-spacing:-.03em}.muted{color:#607080;margin:.3rem 0 0}.actions{display:flex;gap:9px;flex-wrap:wrap}button{border:0;border-radius:8px;padding:11px 16px;font:700 .9rem inherit;cursor:pointer;background:#fff;color:var(--navy);box-shadow:0 1px 2px #18324d24}button.primary{background:var(--navy);color:white}button:hover{filter:brightness(.97)}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 8px 25px #1939570c}.input-grid{display:grid;grid-template-columns:1fr 180px;gap:14px}.field label{display:block;font-weight:700;font-size:.88rem;margin-bottom:7px}.field input,.field textarea{width:100%;border:1px solid #bcc9d5;border-radius:8px;padding:12px;font:inherit;background:#fbfdff}.field textarea{min-height:210px;resize:vertical}.hint{font-size:.84rem;color:#607080;margin:8px 0 0}.report{margin-top:20px}.report-head{display:flex;justify-content:space-between;align-items:start;gap:20px}.report h2{margin:0;font-size:1.55rem}.report-date{font-weight:700;color:#506171}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.stat{background:var(--blue);border:1px solid var(--line);border-radius:9px;padding:12px;text-align:center}.stat strong{display:block;font-size:1.45rem}.stat span{font-size:.75rem;font-weight:800;color:#526170;text-transform:uppercase}.servers{display:grid;gap:12px}.server{border:1px solid var(--line);border-radius:10px;overflow:hidden}.server-title{display:flex;justify-content:space-between;align-items:center;background:var(--navy);color:#fff;padding:12px 15px}.server-title h3{font-size:1rem;margin:0}.badge{font-size:.78rem;font-weight:800;padding:4px 9px;border-radius:99px;background:#fff;color:var(--green)}.badge.bad{color:var(--red);background:#fff1f0}.server-body{display:grid;grid-template-columns:230px 1fr}.when{padding:14px;border-right:1px solid var(--line);background:#f8fafc}.when small,.errors small{display:block;color:#607080;font-weight:700;text-transform:uppercase;font-size:.7rem;margin-bottom:5px}.errors{padding:14px}.errors ul{margin:7px 0 0;padding-left:20px}.ok{color:var(--green);font-weight:800}.badtext{color:var(--red);font-weight:800}.profiles{font-size:.82rem;color:#667582;margin-top:4px}.empty{text-align:center;padding:42px;color:#647383}.notice{display:none;margin-bottom:14px;padding:11px 13px;border-radius:8px;background:#fff5d9;color:#765500;font-weight:650}@media(max-width:760px){.shell{padding:16px}.top,.report-head{display:block}.actions{margin-top:14px}.input-grid,.stats,.server-body{grid-template-columns:1fr}.when{border-right:0;border-bottom:1px solid var(--line)}}
@media print{body{background:white;font-size:11px}.shell{max-width:none;padding:0}.top,.input-panel,.actions,.hint,.notice{display:none!important}.panel{border:0;box-shadow:none;padding:0}.report{margin:0}.report h2{font-size:22px}.stats{margin:12px 0}.stat{padding:7px}.stat strong{font-size:16px}.servers{gap:8px}.server{break-inside:avoid}.server-title{padding:7px 10px}.server-body{grid-template-columns:190px 1fr}.when,.errors{padding:8px}.profiles{font-size:9px}}
</style></head>
<body><main class="shell">
<header class="top"><div><h1>Respaldos de servidores</h1><p class="muted">Pega el reporte completo y revisa únicamente las incidencias.</p></div><div class="actions"><button id="clear">Limpiar</button><button id="demo">Cargar ejemplo</button><button id="print">Imprimir / PDF</button></div></header>
<section class="panel input-panel"><div class="input-grid"><div class="field"><label for="raw">Texto del reporte</label><textarea id="raw" placeholder="Pega aquí el texto que contiene servidores, perfiles, fechas, estados y archivos con error..."></textarea><p class="hint">Los servidores y perfiles ya están configurados. Se reconocen archivos .mdf y .ldf después de un estado de error.</p></div><div class="field"><label for="date">Fecha del reporte</label><input id="date" type="date"><button class="primary" id="analyze" style="width:100%;margin-top:14px">Analizar reporte</button></div></div></section>
<div id="notice" class="notice"></div>
<section class="panel report"><div class="report-head"><div><h2>Reporte de respaldos de servidores</h2><div class="report-date" id="reportDate"></div></div></div><div class="stats" id="stats"></div><div class="servers" id="servers"><div class="empty">Pega un reporte para comenzar.</div></div></section>
</main><script>
const CONFIG=[
 {ip:'192.168.2.178',name:'IFACTURE',profiles:['Comprobantes33','ComprobantesPagos','Data']},
 {ip:'192.168.2.203',name:'AUDICTAMEN',profiles:['Audictamen','datafiscal','datahub','MSSQL']},
 {ip:'192.168.2.208',name:'Compaqi (Tulum)',profiles:['Compac','Data']},
 {ip:'192.168.2.210',name:'Compaqi (Mérida)',profiles:['base_contabilidad','base_nominas','Carpeta_Contpaq','Compac']},
 {ip:'192.168.2.252',name:'Compaqi (Auditoría)',profiles:['Compac','Data']}
];
const raw=document.querySelector('#raw'),date=document.querySelector('#date'),servers=document.querySelector('#servers'),stats=document.querySelector('#stats'),notice=document.querySelector('#notice');date.value=new Date().toISOString().slice(0,10);
function esc(s=''){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function normalize(s){return s.replace(/\\_/g,'_').replace(/&#x20;/g,' ').replace(/[–—]/g,'-').replace(/\s+/g,' ').trim()}
function segmentFor(text,idx){const start=text.search(new RegExp(CONFIG[idx].ip.replace(/\./g,'\\.')));if(start<0)return '';let end=text.length;for(let j=idx+1;j<CONFIG.length;j++){const p=text.search(new RegExp(CONFIG[j].ip.replace(/\./g,'\\.')));if(p>=0&&p<end)end=p}return text.slice(start,end)}
function parse(){const text=normalize(raw.value);let found=0,totalErrors=0;const result=CONFIG.map((server,i)=>{const seg=segmentFor(text,i);if(!seg)return {...server,found:false,time:'No identificado',errors:[]};found++;const profileData=server.profiles.map((profile,p)=>{const rx=new RegExp('(?:^|\\s)'+profile.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\s+(.*?)(?='+(server.profiles.slice(p+1).map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')||'$')+')','i');const m=seg.match(rx);const chunk=m?m[1]:'';const time=(chunk.match(/Último respaldo:\s*([^]*?)(?=Estado:)/i)||[])[1]?.trim()||'';const state=(chunk.match(/Estado:\s*([^.]*)/i)||[])[1]?.trim()||'';const error=/error|fall/i.test(state);const files=error?[...chunk.matchAll(/[A-ZÁÉÍÓÚÑ0-9][A-ZÁÉÍÓÚÑ0-9_]{2,}\.(?:mdf|ldf)/gi)].map(x=>x[0]):[];return {profile,time,state,error,files}});const errors=profileData.flatMap(p=>p.files.map(file=>({profile:p.profile,file})));totalErrors+=errors.length;const times=profileData.map(p=>p.time).filter(Boolean);return {...server,found:true,time:times.at(-1)||'Sin fecha',errors}});
 render(result,found,totalErrors);localStorage.setItem('backupText',raw.value)}
function render(data,found,totalErrors){const affected=data.filter(x=>x.errors.length).length;stats.innerHTML=[["Servidores",found],["Todo realizado",found-affected],["Con error",affected],["Empresas afectadas",totalErrors]].map(x=>`<div class="stat"><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join('');servers.innerHTML=data.filter(x=>x.found).map(s=>`<article class="server"><div class="server-title"><h3>${esc(s.ip)} - ${esc(s.name)}</h3><span class="badge ${s.errors.length?'bad':''}">${s.errors.length?'CON ERROR':'TODO REALIZADO'}</span></div><div class="server-body"><div class="when"><small>Último respaldo detectado</small><strong>${esc(s.time)}</strong><div class="profiles">Perfiles: ${s.profiles.map(esc).join(', ')}</div></div><div class="errors"><small>Empresas que no se respaldaron</small>${s.errors.length?`<ul>${s.errors.map(e=>`<li><span class="badtext">${esc(e.file)}</span> <span class="profiles">${esc(e.profile)}</span></li>`).join('')}</ul>`:'<div class="ok">Todo realizado</div>'}</div></div></article>`).join('')||'<div class="empty">No se reconocieron servidores.</div>';notice.style.display=found<CONFIG.length?'block':'none';notice.textContent=found<CONFIG.length?`Se reconocieron ${found} de ${CONFIG.length} servidores. Revisa que las direcciones IP estén incluidas.`:'';document.querySelector('#reportDate').textContent=date.value?new Date(date.value+'T12:00:00').toLocaleDateString('es-MX',{day:'2-digit',month:'long',year:'numeric'}):''}
document.querySelector('#analyze').onclick=parse;document.querySelector('#print').onclick=()=>window.print();document.querySelector('#clear').onclick=()=>{raw.value='';localStorage.removeItem('backupText');servers.innerHTML='<div class="empty">Pega un reporte para comenzar.</div>';stats.innerHTML='';notice.style.display='none'};document.querySelector('#demo').onclick=()=>{raw.value='192.168.2.178 - IFACTURE Perfiles: Comprobantes33 Último respaldo: 20/06/2026 - 04:00 p. m. Estado: Todo realizado. ComprobantesPagos Último respaldo: 20/06/2026 - 04:20 p. m. Estado: Todo realizado. Data Último respaldo: 20/06/2026 - 04:40 p. m. Estado: error. MANUEL_JESUS_OXTE_CABRERA.mdf MANUEL_JESUS_OXTE_CABRERA_log.ldf 192.168.2.203 - AUDICTAMEN Perfiles: Audictamen Último respaldo: 20/06/2026 - 04:00 p. m. Estado: Todo realizado. datafiscal Último respaldo: 20/06/2026 - 04:20 p. m. Estado: Todo realizado. datahub Último respaldo: 20/06/2026 - 04:40 p. m. Estado: Todo realizado. MSSQL Último respaldo: 20/06/2026 - 05:00 p. m. Estado: Todo realizado.';parse()};raw.value=localStorage.getItem('backupText')||'';if(raw.value)parse();
</script></body></html>
